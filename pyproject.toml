[project]
name = "invenio-crossref"
version = "0.1.0"
description = "Python API wrapper for the Crossref REST and Content Registration APIs, including Crossref XML generation."
authors = [{ name = "Martin Fenner", email = "martin@front-matter.io" }]
requires-python = ">=3.9,<4.0"
readme = "README.md"
license = "MIT"
keywords = ["science", "metadata", "invenio", "crossref", "doi"]
dependencies = ["commonmeta-py>=0.100,<1.0"]

[project.urls]
Repository = "https://github.com/front-matter/invenio-crossref"

[dependency-groups]
docs = ["quartodoc>=0.7.1,<0.8"]
dev = [
  "coverage",
  "ruff>=0.9.3,<1",
  "pytest~=8.3",
  "pytest-cov>=4.1.0,<5",
  "pytest-recording>=0.13.1,<0.14",
  "vcrpy>=6.02",
]

[tool.uv]
default-groups = ["docs", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invenio_crossref"]

[tool.ruff]
line-length = 88
select = ["F401", "F403"]
